<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .form-box,
        .list-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .form-box h2,
        .list-box h2 {
            color: #1f4e79;
            margin-top: 0;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 180px;
        }

        .add-button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-button:hover {
            background: #163a5c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .back {
            margin-top: 20px;
        }

        .back-button {
            background: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-button:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Management</h1>
        <p>Manage Student Information</p>
    </div>


    <div class="container">


        <!-- ADD STUDENT -->

        <div class="form-box">

            <h2>Add Student</h2>

            <form method="POST">

                <div class="form-row">

                    <input
                        type="text"
                        name="roll_no"
                        placeholder="Roll Number"
                        required
                    >

                    <input
                        type="text"
                        name="name"
                        placeholder="Student Name"
                        required
                    >

                    <input
                        type="text"
                        name="class_name"
                        placeholder="Class"
                        required
                    >

                    <button
                        type="submit"
                        class="add-button"
                    >
                        ➕ Add Student
                    </button>

                </div>

            </form>

        </div>


        <!-- STUDENT LIST -->

        <div class="list-box">

            <h2>Student List</h2>

            <table>

                <tr>
                    <th>Roll No.</th>
                    <th>Student Name</th>
                    <th>Class</th>
                    <th>Actions</th>
                </tr>


                {% if students %}

                    {% for student in students %}

                    <tr>

    <td>
        {{ student["roll_no"] }}
    </td>

    <td>
        {{ student["name"] }}
    </td>

    <td>
        {{ student["class_name"] }}
    </td>

    <td>

        <a href="/edit_student/{{ student['id'] }}">
            <button type="button">✏️ Edit</button>
        </a>

        <a href="/delete_student/{{ student['id'] }}"
         onclick="return confirm('Are you sure you want to delete this student?');">

            <button type="button">🗑️ Delete</button>

        </a>

    </td>

</tr>
                    {% endfor %}

                {% else %}

                    <tr>
                        <td colspan="3" class="empty">
                            No students added yet.
                        </td>
                    </tr>

                {% endif %}

            </table>

        </div>


        <!-- BACK BUTTON -->

        <div class="back">

            <a href="/">
                <button
                    type="button"
                    class="back-button"
                >
                    ← Back to Dashboard
                </button>
            </a>

        </div>

    </div>

</body>

</html>
