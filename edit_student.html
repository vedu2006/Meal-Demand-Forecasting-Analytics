<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .back {
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Edit Student</h1>

        <p>Update Student Information</p>

    </div>


    <div class="container">

        <div class="box">

            <h2>Edit Details</h2>

            <form method="POST">

                <label>
                    Roll Number
                </label>

                <input
                    type="text"
                    name="roll_no"
                    value="{{ student['roll_no'] }}"
                    required
                >


                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ student['name'] }}"
                    required
                >


                <label>
                    Class
                </label>

                <input
                    type="text"
                    name="class_name"
                    value="{{ student['class_name'] }}"
                    required
                >


                <button type="submit">
                    💾 Save Changes
                </button>

            </form>


            <div class="back">

                <a href="/students">

                    <button type="button">
                        ← Back to Students
                    </button>

                </a>

            </div>

        </div>

    </div>

</body>

</html>
